[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bracket-validator-andriitrishch"
version = "0.1.0"
authors = [
  { name="Yaroslav Bezghachniuk", email="your.email@example.com" },
]
description = "Lab 5: Bracket validator for Python"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
bracket-validate = "bracket_validator.validator:main"